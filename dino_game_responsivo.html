  display: flex;

.app-shell.night { --ink: #f7f7f7; --paper: #202124; }

  margin-bottom: 10px;
  font-size: 10px;
  text-align: center;

}

  width: 900px;
  max-width: min(calc(100vw - 24px), calc((100dvh - 90px) * 900 / 260));

  touch-action: none;
  transition: background-color 1s ease;
  aspect-ratio: 900 / 260;
}

  position: relative;
  width: 900px;
  height: 260px;

.score-digit-1 { background-position: -108px -300px; }
.score-digit-2 { background-position: -179px -300px; }
.score-digit-3 { background-position: -251px -300px; }
.score-digit-4 { background-position: -323px -300px; }
.score-digit-5 { background-position: -395px -300px; }
.score-digit-6 { background-position: -35px -362px; }
.score-digit-7 { background-position: -107px -362px; }

.dino.dead { width: 40px; height: 43px; background-position: -92px -80px; }

.obstacle.large { width: 25px; height: 50px; background-size: 440px 508px; background-position: -99px -198px; }
.obstacle.clusterSmall { width: 16px; height: 35px; background-size: 440px 508px; background-position: -320px -150px; }
.obstacle.clusterLarge { width: 25px; height: 50px; background-size: 440px 508px; background-position: -243px -198px; }

  background-color: transparent; background-image: var(--sprite); background-repeat: no-repeat;
  image-rendering: pixelated; background-size: 440px 508px; background-position: -22px -28px; cursor: pointer;

<body>
<div class="app-shell day" id="appShell">
  <div class="hint">ESPAÇO / SETA CIMA / TOQUE = PULAR &nbsp;·&nbsp; SETA BAIXO = ABAIXAR</div>
  <div class="game-frame" id="gameFrame">
    <div class="world" role="application" aria-label="Área do jogo">
      <div class="scoreboard">
        <div class="sprite-score is-high" id="hiScore">
          <span class="score-hi-container">
            <span class="score-hi-letter text-letter-h"></span>
            <span class="score-hi-letter text-letter-i"></span>
          </span>
          <span class="score-digits-wrap" id="hiDigits"></span>
        </div>
        <div class="sprite-score" id="curScore">
          <span class="score-digits-wrap" id="curDigits"></span>
        </div>
      </div>
      <div id="cloudsLayer"></div>
      <div class="ground-texture" id="groundTexture"></div>
      <div id="obstaclesLayer"></div>
      <span class="sprite dino idle" id="dinoEl"></span>
      <div class="game-over" id="gameOver" style="display:none;">
        <h2 class="game-over-title">GAME OVER</h2>
        <button class="restart" id="restartBtn" aria-label="Reiniciar jogo" type="button"></button>
        <small>ESPAÇO OU CLIQUE PARA RECOMEÇAR</small>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  const WORLD_WIDTH = 900, WORLD_HEIGHT = 260;
  // Physics baseline for feet/obstacle bottoms. The .ground-texture strip
  // spans top:212px..224px in CSS, so this sits right in the middle of it -
  // feet visibly rest on the ground graphic instead of floating below it.
  const GROUND_Y = 218;
  const DINO_X = 76, DINO_W = 44, DINO_H = 47, DUCK_W = 59, DUCK_H = 30;
  const STORAGE_KEY = 'dino-retro-high-score';

  const obstacleSize = {
    small: { width: 17, height: 35 },
    large: { width: 25, height: 50 },
    clusterSmall: { width: 16, height: 35 },
    clusterLarge: { width: 25, height: 50 },
    bird: { width: 47, height: 34 },
  };

  function initialGame() {
    return {
      phase: 'ready', score: 0, distance: 0, speed: 350,
      dinoY: GROUND_Y - DINO_H, velocityY: 0, ducking: false,
      obstacles: [], clouds: [{ id: 1, x: 270, y: 55 }, { id: 2, x: 640, y: 89 }],
      nextObstacle: 450, nextCloud: 380, lastTime: 0, animationTime: 0, milestone: 0,
    };
  }

  const paddedScore = (v) => Math.floor(v).toString().padStart(5, '0');
  let nextId = 20;

  const SMALL_VARIANTS = ['small', 'clusterSmall'];
  const LARGE_VARIANTS = ['large', 'clusterLarge'];
  const GROUP_PIECE_GAP = 3;

  function makeObstacleGroup(id0, score) {
    const birdAllowed = score >= 500;
    const roll = Math.random();

    if (birdAllowed && roll > 0.82) {
      const size = obstacleSize.bird;
      // The lower flying height must clear the ducking hitbox (see
      // `intersects`): duck's collision top sits at GROUND_Y - DUCK_H + 4,
      // and the bird's collision bottom sits at y + height - 2. GROUND_Y-52
      // used to overlap that duck hitbox by a few pixels, killing the
      // player even when they ducked correctly. GROUND_Y-65 clears it.
      const y = Math.random() < 0.56 ? GROUND_Y - 65 : GROUND_Y - 91;
      const bird = Object.assign({ id: id0, kind: 'bird', x: WORLD_WIDTH + 30, y, frame: 0 }, size);
      return { pieces: [bird], width: size.width };
    }

    const variants = roll < 0.5 ? LARGE_VARIANTS : SMALL_VARIANTS;
    let maxCount = 1;
    if (score > 220) maxCount = 2;
    if (score > 520) maxCount = 3;
    const groupRoll = Math.random();
    let count = 1;
    if (maxCount >= 2 && groupRoll > 0.68) count = 2;
    if (maxCount >= 3 && groupRoll > 0.9) count = 3;

    const pieces = [];
    let cursor = 0;
    for (let i = 0; i < count; i++) {
      const kind = variants[i % variants.length];
      const size = obstacleSize[kind];
      const y = GROUND_Y - size.height;
      pieces.push(Object.assign({ id: id0 + i, kind, x: WORLD_WIDTH + 30 + cursor, y, frame: 0 }, size));
      cursor += size.width + GROUP_PIECE_GAP;
    }
    return { pieces, width: cursor - GROUP_PIECE_GAP };
  }

  // Reaction-time-based gap (seconds -> px via current speed) so the time
  // the player has to react stays roughly constant as speed rises, instead
  // of shrinking to near-zero. Difficulty still ramps via score, bounded
  // below by REACTION_FLOOR so no sequence is ever effectively impossible.
  const REACTION_START = 0.74, REACTION_FLOOR = 0.54;
  function nextGapPx(speed, score, groupWidth) {
    const reactionTime = Math.max(REACTION_FLOOR, REACTION_START - score / 3800);
    const variability = Math.random() * 0.3 * speed;
    // Every so often, throw in a much longer breather gap so obstacles
    // don't feel like nonstop back-to-back jumping. Tight/clustered
    // spacing (via groupWidth/GROUP_PIECE_GAP) can still happen just as
    // often as before - this only adds extra room on top sometimes.
    const breather = Math.random() < 0.25 ? speed * (0.4 + Math.random() * 0.7) : 0;
    return speed * reactionTime + variability + breather + groupWidth;
  }

  function intersects(game, obstacle) {
    const duckingOnGround = game.ducking && game.dinoY >= GROUND_Y - DINO_H - 1;
    const dino = duckingOnGround
      ? { x: DINO_X + 6, y: GROUND_Y - DUCK_H + 4, width: DUCK_W - 12, height: DUCK_H - 8 }
      : { x: DINO_X + 7, y: game.dinoY + 6, width: DINO_W - 14, height: DINO_H - 10 };
    const marginX = obstacle.kind === 'bird' ? 7 : 3;
    const marginY = obstacle.kind === 'bird' ? 8 : 3;
    const target = {
      x: obstacle.x + marginX, y: obstacle.y + marginY,
      width: obstacle.width - marginX * 2, height: obstacle.height - marginY - 2,
    };
    return dino.x < target.x + target.width && dino.x + dino.width > target.x &&
           dino.y < target.y + target.height && dino.y + dino.height > target.y;
  }

  let game = initialGame();
  let highScore = Number(window.localStorage.getItem(STORAGE_KEY)) || 0;
  let touchState = null;
  let holdJump = false;

  const dinoEl = document.getElementById('dinoEl');
  const groundTextureEl = document.getElementById('groundTexture');
  const cloudsLayer = document.getElementById('cloudsLayer');
  const obstaclesLayer = document.getElementById('obstaclesLayer');
  const gameOverEl = document.getElementById('gameOver');
  const appShell = document.getElementById('appShell');
  const hiDigits = document.getElementById('hiDigits');
  const curDigits = document.getElementById('curDigits');
  const restartBtn = document.getElementById('restartBtn');
  const gameFrame = document.getElementById('gameFrame');

  function renderDigits(container, value) {
    const str = paddedScore(value);
    container.innerHTML = '';
    for (const d of str) {
      const span = document.createElement('span');
      span.className = 'score-digit score-digit-' + d;
      container.appendChild(span);
    }
  }

  function saveHighScore(score) {
    const rounded = Math.floor(score);
    if (rounded > highScore) {
      highScore = rounded;
      window.localStorage.setItem(STORAGE_KEY, String(rounded));
    }
  }

  // Minimum time the "GAME OVER" state must stay visible before a new
  // jump/tap is allowed to restart. Without this, the very same key
  // press or touch that caused the collision (still in flight when the
  // obstacle was hit) immediately calls jump() -> start(), wiping the
  // game-over screen in the same frame it appeared - the dead face just
  // flashes for an instant instead of the game actually stopping.
  const RESTART_COOLDOWN_MS = 400;

  function start() {
    if (game.phase === 'playing') return;
    game = initialGame();
    game.phase = 'playing';
  }

  function jump() {
    if (game.phase !== 'playing') {
      if (game.phase === 'gameover' && performance.now() - game.overAt < RESTART_COOLDOWN_MS) return;
      start();
      game.velocityY = -720;
      return;
    }
    const onGround = game.dinoY >= GROUND_Y - DINO_H - 1;
    if (onGround) { game.velocityY = -720; game.ducking = false; }
  }

  function setDuck(ducking) {
    if (game.phase !== 'playing') return;
    game.ducking = ducking;
    if (ducking && game.dinoY < GROUND_Y - DINO_H - 1) game.velocityY += 420;
  }

  window.addEventListener('keydown', (e) => {
    if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      holdJump = true;
      if (!e.repeat) jump();
    }
    if (e.code === 'ArrowDown') setDuck(true);
  }, { passive: false });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') holdJump = false;
    if (e.code === 'ArrowDown') setDuck(false);
  });

  gameFrame.addEventListener('mousedown', (e) => {
    if (e.target === restartBtn || restartBtn.contains(e.target)) return;
    holdJump = true;
    jump();
  });
  window.addEventListener('mouseup', () => { holdJump = false; });
  window.addEventListener('blur', () => { holdJump = false; setDuck(false); });

  gameFrame.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchState = { x: t.clientX, y: t.clientY, at: performance.now() };
    if (game.phase === 'gameover') return;
    window.setTimeout(() => {
      if (touchState && performance.now() - touchState.at > 170) setDuck(true);
    }, 180);
  }, { passive: true });

  gameFrame.addEventListener('touchend', (e) => {
    const start_ = touchState;
    const t = e.changedTouches[0];
    touchState = null;
    setDuck(false);
    if (!start_) return;
    const movedDown = t.clientY - start_.y > 28;
    const held = performance.now() - start_.at > 210;
    if (movedDown) return;
    if (!held) jump();
  });

  gameFrame.addEventListener('touchcancel', () => { touchState = null; setDuck(false); });
  restartBtn.addEventListener('click', start);

  function tick(time) {
    const delta = game.lastTime ? Math.min((time - game.lastTime) / 1000, 0.035) : 0;
    game.lastTime = time;
    if (delta > 0) game.animationTime += delta;

    if (game.phase === 'playing' && delta > 0) {
      game.distance += game.speed * delta;
      game.score = game.distance / 25;
      game.speed = Math.min(760, 350 + game.score * 0.27);

      game.velocityY += (game.ducking ? 2600 : 2100) * delta;
      game.dinoY += game.velocityY * delta;
      const floor = GROUND_Y - DINO_H;
      if (game.dinoY >= floor) { game.dinoY = floor; game.velocityY = 0; }
      // Holding jump (space / up arrow / mouse click) keeps the dino
      // hopping continuously instead of a single jump: as soon as it's
      // back on the ground while the input is still held, launch again.
      if (holdJump && game.dinoY >= floor) { game.velocityY = -720; game.ducking = false; }

      game.nextObstacle -= game.speed * delta;
      if (game.nextObstacle <= 0) {
        const group = makeObstacleGroup(nextId, game.score);
        nextId += group.pieces.length;
        game.obstacles.push(...group.pieces);
        game.nextObstacle = nextGapPx(game.speed, game.score, group.width);
      }
      game.obstacles.forEach((o) => {
        o.x -= game.speed * delta;
        if (o.kind === 'bird') o.frame = Math.floor(game.animationTime * 7) % 2;
      });
      game.obstacles = game.obstacles.filter((o) => o.x + o.width > -20);

      game.nextCloud -= 45 * delta;
      if (game.nextCloud <= 0) {
        game.clouds.push({ id: nextId++, x: WORLD_WIDTH + 30, y: 40 + Math.random() * 80 });
        game.nextCloud = 270 + Math.random() * 310;
      }
      game.clouds.forEach((c) => (c.x -= 29 * delta));
      game.clouds = game.clouds.filter((c) => c.x > -60);

      if (game.obstacles.some((o) => intersects(game, o))) {
        game.phase = 'gameover';
        game.ducking = false;
        game.overAt = time;
        saveHighScore(game.score);
      }
    }

    render();
    requestAnimationFrame(tick);
  }

  function render() {
    const night = Math.floor(game.score / 700) % 2 === 1;
    appShell.className = 'app-shell ' + (night ? 'night' : 'day');

    const onGround = game.dinoY >= GROUND_Y - DINO_H - 1;
    let pose = 'idle';
    if (game.phase === 'gameover') pose = 'dead';
    else if (!onGround) pose = 'jump';
    else if (game.ducking) pose = Math.floor(game.animationTime * 9) % 2 ? 'duck1' : 'duck2';
    else if (game.phase === 'playing') pose = Math.floor(game.animationTime * 9) % 2 ? 'run1' : 'run2';
    else pose = 'idle'; // standing still, both legs planted (no ground-dash marks)

    dinoEl.className = 'sprite dino ' + pose;
    dinoEl.style.left = DINO_X + 'px';
    dinoEl.style.top = (game.ducking && onGround ? GROUND_Y - DUCK_H : game.dinoY) + 'px';

    groundTextureEl.style.backgroundPositionX = (-(game.distance % 600)) + 'px';

    cloudsLayer.innerHTML = '';
    for (const c of game.clouds) {
      const el = document.createElement('span');
      el.className = 'sprite cloud';
      el.style.left = c.x + 'px';
      el.style.top = c.y + 'px';
      cloudsLayer.appendChild(el);
    }

    obstaclesLayer.innerHTML = '';
    for (const o of game.obstacles) {
      const el = document.createElement('span');
      el.className = 'sprite obstacle ' + o.kind + (o.kind === 'bird' ? ' bird-' + o.frame : '');
      el.style.left = o.x + 'px';
      el.style.top = o.y + 'px';
      obstaclesLayer.appendChild(el);
    }

    gameOverEl.style.display = game.phase === 'gameover' ? 'flex' : 'none';

    renderDigits(hiDigits, highScore);
    renderDigits(curDigits, game.score);
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
